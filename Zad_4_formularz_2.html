<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz</title>
</head>
<body>
  <form>
      <label for="question">Twoje pytanie:</label><br>
      <textarea id="question" name="question" placeholder="Wpisz swoje pytanie..." rows="4"></textarea><br>

      <button type="submit">Wyślij</button>
  </form>
  <div class="answer-box">
      <p id="answer">Tutaj pojawi się odpowiedź.</p>
  </div>
</body>
</html>
